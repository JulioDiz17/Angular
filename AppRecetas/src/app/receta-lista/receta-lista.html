<button class="btn btn-success mb-3">Nueva receta</button>

<div class="list-group">
  @for (rec of listaRecetas; track rec.id) {
    <a href="#" 
       (click)="$event.preventDefault(); seleccionarReceta(rec)"
       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
      <div>
        <h5 class="mb-1">{{ rec.nombre }}</h5>
        <p class="mb-1 text-muted">{{ rec.descripcion }}</p>
      </div>
      
      <img [src]="'/' + rec.image" [alt]="rec.nombre" style="width: 50px; height: 50px; object-fit: cover;">
    </a>
  }
</div>
